<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Markdown 渲染验证</title>
<link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/news-qa.css">
<style>body{background:#f3f5f8;padding:40px;font-family:system-ui}main{max-width:760px;margin:auto;padding:32px;background:white;border-radius:14px;border:1px solid #dce3ed}.checks{padding:16px;background:#edf6f1;margin-bottom:24px;color:#48745d;font-size:12px}</style>
<main><div class="checks" id="checks">正在验证…</div><div class="qa-answer qa-markdown" id="answer"></div></main>
<script src="/static/vendor/marked.umd.js"></script><script src="/static/vendor/purify.min.js"></script><script src="/static/js/news-qa.js"></script>
<script>
const fixture = '## 今天采集的新闻\n\n**北京时间：2026 年 10 月 22 日**\n\n共找到 **3 条**新闻，仅展示今天采集的记录。\n\n1. **新闻标题示例**：根据已采集摘要概括内容。[1]\n2. 另一条新闻要点，正常显示列表。\n\n> 采集时间与新闻事件发生时间分别标注。\n\n| 来源 | 采集时间 |\n| --- | --- |\n| 新闻源 | 11:10 |\n\n示例字段：`timestamp`\n\n```text\n代码块保持原有换行\n第二行内容\n```\n\n[安全链接](https://example.com)\n\n<img src=x onerror="window.qaAttack=true"><script>window.qaAttack=true<\/script>[危险链接](javascript:alert(1))';
const answer=document.getElementById('answer');
NewsQa.renderMarkdown(answer,fixture);
const tests=[['加粗',!!answer.querySelector('strong')],['列表',!!answer.querySelector('ol li')],['表格',!!answer.querySelector('table')],['代码块',!!answer.querySelector('pre code')],['脚本过滤',!answer.querySelector('script,img')&&!window.qaAttack],['危险链接过滤',!answer.querySelector('a[href^="javascript:"]')],['新窗口保护',answer.querySelector('a[href="https://example.com"]').rel==='noopener noreferrer']];
document.getElementById('checks').textContent=tests.map(([name,ok])=>(ok?'PASS ':'FAIL ')+name).join(' · ');
</script></html>
