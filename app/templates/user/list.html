{% extends "../base.html" %}
{% block body %}
<div class="admin-page management-page" data-management="user">
    <div class="page-header">
        <div class="page-header-left">
            <h1 class="page-title"><i class="fas fa-users"></i> 成员管理</h1>
            <p class="page-subtitle">连接团队成员，为每个人配置合适的角色</p>
        </div>
    </div>
    <div class="layui-card">
        <div class="layui-card-body">
            <table id="userTable" lay-filter="userTable"></table>
        </div>
    </div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="toolbarDemo">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i> 新增用户
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="batchDel">
            <i class="layui-icon layui-icon-delete"></i> 批量删除
        </button>
    </div>
</script>

<!-- 行工具栏 -->
<script type="text/html" id="barDemo">
    {% raw '{{# if(d.username === "admin"){ }}' %}
        <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="edit">改密</a>
        <span class="layui-badge layui-bg-gray">系统默认</span>
    {% raw '{{# } else { }}' %}
        <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    {% raw '{{# } }}' %}
</script>

<!-- 新增/编辑表单模板 (隐藏) -->
<script type="text/html" id="userFormTpl">
    <div class="admin-layer-content">
        <form class="layui-form admin-form-container" lay-filter="userForm">
            <input type="hidden" name="id">
            <input type="hidden" name="action" id="formAction">
            <input type="hidden" name="_xsrf" value="{{ handler.xsrf_token }}">
            
            <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-block">
                    <input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">角色设置</label>
                <div class="layui-input-block">
                    <select name="role_id" id="roleSelect">
                        <option value="">暂不分配角色</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">密码</label>
                <div class="layui-input-block">
                    <input type="password" name="password" id="passwordInput" placeholder="请输入密码" autocomplete="off" class="layui-input">
                    <div class="layui-form-mid layui-word-aux" id="pwdHint"></div>
                </div>
            </div>
            
            <!-- 隐藏的真实提交按钮 -->
            <button class="layui-hide" lay-submit lay-filter="saveUser" id="realSaveUserBtn"></button>
        </form>
    </div>
    <div class="admin-layer-footer">
        <button class="layui-btn layui-btn-normal layui-btn-sm" onclick="document.getElementById('realSaveUserBtn').click()">确定</button>
        <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" onclick="layer.closeAll('page')">取消</button>
    </div>
</script>
{% end %}

{% block script %}
<script src="{{ static_url('js/management-cards.js') }}"></script>
<script>
layui.use(['laytpl','table', 'form', 'layer', 'jquery'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.jquery;
    
    // 从 Tornado 模板中获取 XSRF Token
    // 由于此页面在 iframe 中，直接通过模板注入
    var xsrf = '{{ handler.xsrf_token }}';
    var allRoles = [];

    // 获取所有角色用于下拉框
    $.get('/api/role', function(res){
        if(res.code === 0){
            allRoles = res.data;
        }
    }, 'json');

    // 渲染表格
    ManagementCards.render({
        elem: '#userTable',
        url: '/api/user', // 数据接口
        toolbar: '#toolbarDemo', // 开启头部工具栏
        defaultToolbar: ['filter', 'exports'],
        page: { limit: 20 }, // 开启分页，默认 20 条
        cols: [[ // 表头
            {type: 'checkbox', fixed: 'left'},
            {field: 'id', title: 'ID', width: 80, sort: true, fixed: 'left'},
            {field: 'username', title: '用户名', minWidth: 150},
            {field: 'role_name', title: '所属角色', minWidth: 150, templet: function(d){
                if(d.username === 'admin') return '<span class="layui-badge layui-bg-blue">超级管理员</span>';
                return d.role_name ? '<span class="layui-badge-rim">' + d.role_name + '</span>' : '<span class="layui-badge layui-bg-gray">未分配</span>';
            }},
            {field: 'create_at', title: '创建时间', width: 170, sort: true},
            {fixed: 'right', title:'操作', toolbar: '#barDemo', width: 175}
        ]],
        parseData: function(res){ // 重新组装以符合 layui 要求
            return {
                "code": res.code,
                "msg": res.msg,
                "count": res.count,
                "data": res.data
            };
        }
    });

    // 头工具栏事件
    ManagementCards.on('toolbar(userTable)', function(obj){
        var checkStatus = ManagementCards.checkStatus(obj.config.id);
        if(obj.event === 'add'){
            openForm('add', {});
        } else if(obj.event === 'batchDel'){
            var data = checkStatus.data;
            if(data.length === 0){
                return layer.msg('请先选择要删除的用户', {icon: 0});
            }
            layer.confirm('确定要删除选中的 ' + data.length + ' 个用户吗？', {icon: 3, title:'提示'}, function(index){
                var ids = data.map(function(item){ return item.id; }).join(',');
                $.post('/api/user', {action: 'batch_delete', ids: ids, _xsrf: xsrf}, function(res){
                    if(res.code === 0){
                        layer.msg('批量删除成功', {icon: 1});
                        ManagementCards.reload('userTable');
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
                layer.close(index);
            });
        }
    });

    // 行工具事件
    ManagementCards.on('tool(userTable)', function(obj){
        var data = obj.data;
        if(obj.event === 'del'){
            layer.confirm('真的删除用户【' + data.username + '】么？', {icon: 3, title:'提示'}, function(index){
                $.post('/api/user', {action: 'delete', id: data.id, _xsrf: xsrf}, function(res){
                    if(res.code === 0){
                        obj.del(); // 删除对应行 DOM 结构
                        layer.close(index);
                        layer.msg('删除成功', {icon: 1});
                    } else {
                        layer.msg(res.msg, {icon: 2});
                    }
                }, 'json');
            });
        } else if(obj.event === 'edit'){
            openForm('edit', data);
        }
    });

    // 打开表单弹窗
    function openForm(action, data) {
        layer.open({
            type: 1,
            title: action === 'add' ? '新增用户' : '编辑用户',
            area: ['550px', '350px'],
            content: $('#userFormTpl').html(),
            success: function(layero, index){
                $('#formAction').val(action);
                
                // 渲染角色下拉框
                var sel = $('#roleSelect');
                sel.empty().append('<option value="">暂不分配角色</option>');
                $.each(allRoles, function(i, item){
                    sel.append('<option value="'+item.id+'">'+item.name+'</option>');
                });
                
                if(action === 'edit'){
                    // 表单赋值
                    form.val('userForm', {
                        "id": data.id,
                        "username": data.username,
                        "role_id": data.role_id || ""
                    });
                    
                    // admin 保护逻辑
                    if(data.username === 'admin') {
                        $('input[name="username"]').prop('readonly', true).addClass('layui-disabled');
                        $('#roleSelect').prop('disabled', true);
                        sel.empty().append('<option value="">超级管理员 (系统默认)</option>');
                    }
                    
                    // 修改模式下密码选填
                    $('#passwordInput').attr('placeholder', '不修改请留空')
                                     .removeAttr('required')
                                     .removeAttr('lay-verify');
                    $('#pwdHint').text('留空表示不修改密码');
                } else {
                    // 新增模式下密码必填
                    $('#passwordInput').attr('required', 'required')
                                     .attr('lay-verify', 'required');
                    $('#pwdHint').text('');
                }
                form.render('select');
                
                // 监听提交
                form.on('submit(saveUser)', function(formData){
                    $.post('/api/user', formData.field, function(res){
                        if(res.code === 0){
                            layer.close(index);
                            layer.msg(res.msg, {icon: 1});
                            ManagementCards.reload('userTable'); // 重载表格
                        } else {
                            layer.msg(res.msg, {icon: 2});
                        }
                    }, 'json');
                    return false; // 阻止表单跳转
                });
            }
        });
    }
});
</script>
{% end %}
