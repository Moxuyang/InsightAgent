{% extends "../base.html" %}
{% block style %}
<style>
    * { box-sizing: border-box; }

    .dashboard-shell {
        display: flex;
        height: calc(100vh - 56px);
        background: var(--bg-subtle);
    }

    /* ========== 左侧历史面板 ========== */
    .history-panel {
        width: 260px;
        min-width: 260px;
        background: var(--surface);
        border-right: 1px solid oklch(0.88 0.005 25);
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 12px rgba(0,0,0,.03);
    }
    .history-panel-header {
        padding: 16px 16px 12px;
        border-bottom: 1px solid oklch(0.92 0.003 25);
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .history-panel-header h3 {
        font-size: 15px;
        color: var(--ink);
        font-weight: 700;
        margin: 0;
    }
    .new-chat-btn {
        width: 32px; height: 32px;
        border-radius: 8px;
        background: var(--accent);
        border: none; color: #fff;
        font-size: 18px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all .25s;
        box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .new-chat-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .history-list {
        flex: 1; overflow-y: auto;
        padding: 8px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 4px; }
    .history-item {
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: all .2s;
        margin-bottom: 4px;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .history-item:hover {
        background: oklch(0.96 0.003 25);
        border-color: oklch(0.88 0.005 25);
    }
    .history-item.active {
        background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 6%, transparent), color-mix(in srgb, var(--accent) 4%, transparent));
        border-color: color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .history-item .hi-icon {
        width: 34px; height: 34px; border-radius: 10px;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 14px; flex-shrink: 0;
    }
    .history-item .hi-info { flex: 1; min-width: 0; }
    .history-item .hi-title {
        font-size: 13px; color: var(--ink); font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item .hi-time {
        font-size: 11px; color: var(--ink-muted); margin-top: 2px;
    }
    .history-item .hi-delete {
        color: #ccc; cursor: pointer; font-size: 13px;
        visibility: hidden; transition: all .2s;
    }
    .history-item:hover .hi-delete { visibility: visible; color: var(--error); }
    .history-empty {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        height: 100%; color: oklch(0.75 0.008 25); font-size: 13px;
        padding: 20px;
    }
    .history-empty i { font-size: 36px; margin-bottom: 10px; opacity: .5; }

    /* ========== 右侧聊天区 ========== */
    .chat-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: linear-gradient(180deg, var(--bg-subtle) 0%, oklch(0.96 0.003 25) 100%);
    }

    /* 快捷入口 */
    .chat-hero {
        text-align: center;
        padding: 40px 20px 20px;
        animation: fadeInUp .5s ease;
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .chat-hero .hero-icon {
        width: 64px; height: 64px; border-radius: 16px;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; color: #fff;
        margin: 0 auto 16px;
        box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .chat-hero h1 { font-size: 22px; color: var(--ink); font-weight: 700; margin-bottom: 6px; }
    .chat-hero p { font-size: 13px; color: var(--ink-muted); }
    .chat-hero .quick-actions {
        display: flex; flex-wrap: wrap; gap: 10px;
        justify-content: center; margin-top: 18px;
    }
    .quick-action {
        background: var(--surface); border: 1px solid oklch(0.88 0.005 25);
        border-radius: 20px; padding: 8px 18px;
        cursor: pointer; font-size: 13px; color: var(--ink);
        transition: all .25s; white-space: nowrap;
    }
    .quick-action:hover {
        border-color: var(--accent); color: var(--accent);
        box-shadow: 0 2px 12px color-mix(in srgb, var(--accent) 10%, transparent);
        transform: translateY(-1px);
    }
    .quick-action i { margin-right: 6px; color: var(--accent); }

    /* 消息列表 */
    .chat-messages { flex: 1; overflow-y: auto; padding: 6px 0; }
    .chat-messages-inner { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .chat-empty { display: flex; align-items: center; justify-content: center; height: 100%; }

    /* 单条消息 */
    .msg-row { display: flex; margin-bottom: 20px; animation: msgSlideIn .35s cubic-bezier(.4,0,.2,1); }
    @keyframes msgSlideIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-avatar {
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; flex-shrink: 0;
    }
    .msg-row.assistant .msg-avatar {
        background: var(--accent);
        color: #fff; margin-right: 10px;
    }
    .msg-row.user .msg-avatar {
        background: var(--accent);
        color: #fff; margin-left: 10px;
    }
    .msg-body { max-width: 72%; }
    .msg-bubble {
        padding: 12px 16px; border-radius: 16px;
        font-size: 14px; line-height: 1.7;
        word-break: break-word; white-space: pre-wrap;
    }
    .msg-row.assistant .msg-bubble {
        background: var(--surface); border: 1px solid oklch(0.88 0.005 25);
        border-top-left-radius: 4px; color: var(--ink);
        box-shadow: 0 1px 4px rgba(0,0,0,.03);
    }
    .msg-row.user .msg-bubble {
        background: var(--accent);
        color: #fff; border-top-right-radius: 4px;
    }
    .msg-time {
        font-size: 11px; color: var(--ink-muted); margin-top: 4px; padding: 0 4px;
    }
    .msg-row.user .msg-time { text-align: right; }
    .msg-typing .msg-bubble { padding: 8px 16px; }
    .msg-typing .dots { display: flex; gap: 4px; }
    .msg-typing .dots span {
        width: 6px; height: 6px; border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 25%, transparent); animation: dotBlink 1.4s infinite;
    }
    .msg-typing .dots span:nth-child(2) { animation-delay: .2s; }
    .msg-typing .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dotBlink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

    /* 底部输入栏 */
    .chat-input-bar {
        background: var(--surface); border-top: 1px solid oklch(0.88 0.005 25);
        padding: 12px 20px;
        box-shadow: 0 -2px 8px rgba(0,0,0,.03);
    }
    .chat-input-inner {
        max-width: 760px; margin: 0 auto;
        display: flex; gap: 10px; align-items: center;
    }
    .chat-input-inner input {
        flex: 1; height: 44px;
        border: 2px solid oklch(0.88 0.005 25); border-radius: 24px;
        padding: 0 18px; font-size: 14px;
        outline: none; transition: all .3s;
        background: var(--bg-subtle);
    }
    .chat-input-inner input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
        background: var(--surface);
    }
    .chat-input-inner button {
        height: 44px; padding: 0 22px;
        background: var(--accent);
        color: #fff; border: none; border-radius: 24px;
        font-size: 14px; font-weight: 600;
        cursor: pointer; transition: all .3s;
        box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 25%, transparent);
        white-space: nowrap;
    }
    .chat-input-inner button:hover {
        box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent);
        transform: translateY(-1px);
    }
    .chat-input-inner button:disabled {
        opacity: .6; cursor: not-allowed; transform: none;
    }

    .chat-hero.hidden { display: none; }

    /* ========== 文件上传区域 ========== */
    .upload-btn {
        width: 44px; height: 44px; border-radius: 50%;
        background: var(--bg-subtle);
        border: 2px dashed oklch(0.88 0.005 25);
        cursor: pointer; font-size: 18px;
        color: var(--ink-muted);
        display: flex; align-items: center; justify-content: center;
        transition: all .3s; flex-shrink: 0;
    }
    .upload-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 5%, transparent);
    }
    .upload-btn.uploading {
        pointer-events: none; opacity: .6;
        animation: uploadPulse 1s infinite;
    }
    @keyframes uploadPulse {
        0%, 100% { border-color: var(--accent); }
        50% { border-color: color-mix(in srgb, var(--accent) 20%, transparent); }
    }

    .file-tags-row {
        display: flex; flex-wrap: wrap; gap: 6px;
        padding: 0 0 8px;
        max-width: 760px; margin: 0 auto;
    }
    .file-tag {
        display: inline-flex; align-items: center; gap: 6px;
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);
        border-radius: 16px; padding: 4px 12px;
        font-size: 12px; color: var(--ink);
    }
    .file-tag .ft-name {
        max-width: 120px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
    }
    .file-tag .ft-size { color: var(--ink-muted); font-size: 10px; }
    .file-tag .ft-remove {
        cursor: pointer; color: var(--error);
        font-size: 14px; line-height: 1;
        margin-left: 2px;
    }
    .file-tag .ft-status {
        font-size: 10px; padding: 1px 6px; border-radius: 8px;
    }
    .file-tag .ft-status.uploading { background: oklch(0.65 0.18 85); color: #fff; }
    .file-tag .ft-status.done { background: oklch(0.48 0.15 155); color: #fff; }
    .file-tag .ft-status.fail { background: var(--error); color: #fff; }

    .msg-file-attach {
        display: inline-flex; align-items: center; gap: 8px;
        background: color-mix(in srgb, var(--accent) 6%, transparent);
        border-radius: 8px; padding: 8px 12px;
        margin-top: 6px; font-size: 12px;
    }
    .msg-file-attach i { color: var(--accent); font-size: 16px; }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
        .history-panel { width: 0; min-width: 0; overflow: hidden; }
        .history-panel.open { width: 260px; min-width: 260px; }
    }
</style>
{% end %}

{% block body %}
<div class="dashboard-shell">
    <!-- ====== 左侧历史对话面板 ====== -->
    <div class="history-panel" id="historyPanel">
        <div class="history-panel-header">
            <h3><i class="fas fa-history" style="color:var(--accent);margin-right:6px;"></i> 历史对话</h3>
            <button class="new-chat-btn" onclick="newChat()" title="新建对话">+</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty" id="historyEmpty">
                <i class="fas fa-comments"></i>
                <span>暂无对话记录</span>
            </div>
        </div>
    </div>

    <!-- ====== 右侧聊天区 ====== -->
    <div class="chat-wrapper">
        <div class="agent-task-notice" id="agentTaskNotice" role="status" hidden></div>
        <!-- 顶部欢迎区 -->
        <div class="chat-hero" id="chatHero">
            <div class="hero-icon"><i class="fas fa-robot"></i></div>
            <h1>欢迎回来，{{ username }}</h1>
            <p>向 AI 智能问数系统提问，获取数据驱动的洞察分析</p>
            <div class="quick-actions">
                <div class="quick-action" onclick="quickAsk('分析最近一周的数据趋势')">
                    <i class="fas fa-chart-line"></i> 数据趋势分析
                </div>
                <div class="quick-action" onclick="quickAsk('统计当前系统的用户活跃情况')">
                    <i class="fas fa-users"></i> 用户活跃统计
                </div>
                <div class="quick-action" onclick="quickAsk('生成一份数据摘要报告')">
                    <i class="fas fa-file-alt"></i> 数据摘要报告
                </div>
                <div class="quick-action" onclick="exportPdf()">
                    <i class="fas fa-file-pdf"></i> 导出PDF
                </div>
            </div>
        </div>

        <!-- 消息滚动区 -->
        <div class="chat-messages" id="chatMessages">
            <div class="chat-messages-inner" id="chatMessagesInner">
                <div class="chat-empty" id="chatEmpty"></div>
            </div>
        </div>

        <!-- 底部输入栏 -->
        <div class="chat-input-bar">
            <div class="file-tags-row" id="fileTagsRow"></div>
            <div class="chat-input-inner">
                <input aria-label="问题" type="text" id="queryInput" placeholder="输入你的问题，如：本月用户增长趋势如何？" autocomplete="off">
                <input type="file" id="fileInput" style="display:none;" multiple onchange="handleFileSelect(event)">
                <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="上传文件" aria-label="上传文件"><i class="fas fa-paperclip"></i></button>
                <button id="sendBtn" onclick="submitQuery()"><i class="fas fa-paper-plane"></i> 发送</button>
                <button class="layui-btn layui-btn-sm" onclick="exportPdf()" style="height:44px;border-radius:var(--radius-full);background:var(--ink-muted);border-color:var(--ink-muted);color:#fff;" title="导出当前对话为PDF"><i class="fas fa-file-pdf"></i></button>
            </div>
        </div>
    </div>
</div>
{% end %}

{% block script %}
<script>
layui.use(['jquery', 'layer'], function(){
    var $ = layui.jquery;
    var layer = layui.layer;
    var isStreaming = false;
    var sessionId = 0;
    var pendingFiles = [];
    var fileContextVersion = 0;
    var fullAiResponse = '';

    var $messagesInner = $('#chatMessagesInner');
    var $chatMessages = $('#chatMessages');
    var $chatHero = $('#chatHero');
    var $chatEmpty = $('#chatEmpty');
    var $sendBtn = $('#sendBtn');
    var $historyList = $('#historyList');
    var $historyEmpty = $('#historyEmpty');
    var xsrf = '{{ handler.xsrf_token }}';

    // ===== 左侧会话列表 =====
    function loadSessionList(activeId) {
        $.get('/api/dashboard_chat?action=sessions', function(res) {
            if (res.code !== 0 || !res.data || !res.data.length) {
                $historyList.html('<div class="history-empty"><i class="fas fa-comments"></i><span>暂无对话记录</span></div>');
                return;
            }
            var html = '';
            $.each(res.data, function(i, s) {
                var isActive = (activeId && activeId == s.id) ? ' active' : '';
                var title = s.title || '新对话';
                var time = s.updated_at ? s.updated_at.substring(5, 16) : '';
                html += '<div class="history-item' + isActive + '" data-id="' + s.id + '" onclick="switchSession(' + s.id + ')">' +
                    '<div class="hi-icon"><i class="fas fa-comment-dots"></i></div>' +
                    '<div class="hi-info">' +
                        '<div class="hi-title">' + title.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
                        '<div class="hi-time">' + time + '</div>' +
                    '</div>' +
                    '<span class="hi-delete" onclick="event.stopPropagation();deleteSession(' + s.id + ')" title="删除"><i class="fas fa-times"></i></span>' +
                '</div>';
            });
            $historyList.html(html);
            $historyEmpty.hide();
        });
    }

    // ===== 切换会话 =====
    window.switchSession = function(id) {
        if (isStreaming) return layer.msg('AI 正在回复中，请稍候...', {icon: 0});
        sessionId = id;
        pendingFiles = []; fileContextVersion++; $('#fileTagsRow').empty();
        $messagesInner.empty();
        $chatHero.addClass('hidden');
        loadSessionList(id);

        $.get('/api/dashboard_chat?action=history&session_id=' + id, function(res) {
            if (res.code === 0 && res.data && res.data.messages) {
                $messagesInner.empty();
                $.each(res.data.messages, function(i, m) {
                    addBubble(m.role, m.content);
                });
            }
            scrollToBottom();
        });
    };

    // ===== 新建对话 =====
    window.newChat = function() {
        if (isStreaming) return layer.msg('AI 正在回复中，请稍候...', {icon: 0});
        sessionId = 0;
        pendingFiles = []; fileContextVersion++; $('#fileTagsRow').empty();
        $messagesInner.empty();
        $chatHero.removeClass('hidden');
        $('#queryInput').val('');
        loadSessionList(0);
        scrollToBottom();
    };

    // ===== 删除会话 =====
    window.deleteSession = function(id) {
        layer.confirm('确定删除该对话记录吗？', {
            icon: 3, title: '提示',
            btn: ['确定', '取消']
        }, function(index) {
            $.post('/api/dashboard_chat', {
                action: 'delete_session',
                session_id: id,
                _xsrf: xsrf
            }, function(res) {
                layer.close(index);
                if (res.code === 0) {
                    if (sessionId == id) newChat();
                    else loadSessionList(sessionId);
                    layer.msg('删除成功', {icon: 1});
                } else {
                    layer.msg(res.msg || '删除失败', {icon: 2});
                }
            }, 'json');
        });
    };

    function scrollToBottom() {
        $chatMessages.scrollTop($chatMessages[0].scrollHeight);
    }

    function nowTime() {
        var d = new Date();
        return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    }

    function addBubble(role, content, extraClass) {
        $chatHero.addClass('hidden');
        $chatEmpty.hide();
        var cls = role === 'user' ? 'user' : 'assistant';
        var icon = role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
        var bubble = $(
            '<div class="msg-row ' + cls + (extraClass ? ' ' + extraClass : '') + '">' +
                '<div class="msg-avatar">' + icon + '</div>' +
                '<div class="msg-body">' +
                    '<div class="msg-bubble"></div>' +
                    '<div class="msg-time">' + nowTime() + '</div>' +
                '</div>' +
            '</div>'
        );
        var target = bubble.find('.msg-bubble').text(content);
        if (role === 'assistant') {
            target.addClass('qa-markdown');
            NewsQa.renderMarkdown(target[0], content);
        }
        // References saved with the answer remain usable after reloading a session.
        if (role === 'assistant' && content.indexOf('\n\n参考资料：\n') >= 0) {
            var parts = content.split('\n\n参考资料：\n');
            target.empty();
            var savedAnswer = $('<div class="qa-answer qa-markdown"></div>').appendTo(target);
            NewsQa.renderMarkdown(savedAnswer[0], parts.shift());
            var savedSources = $('<div class="qa-sources"></div>').appendTo(target);
            $('<strong></strong>').text('参考新闻').appendTo(savedSources);
            parts.join('\n').split('\n').forEach(function(line) {
                var match = line.match(/^(.*) (https?:\/\/\S+)$/);
                if (match) {
                    try {
                        var url = new URL(match[2]);
                        if (url.protocol === 'https:' || url.protocol === 'http:') {
                            $('<a class="qa-source" target="_blank" rel="noopener noreferrer"></a>').attr('href', url.href).text(match[1]).appendTo(savedSources);
                            return;
                        }
                    } catch (_) {}
                }
                $('<div class="qa-source"></div>').text(line).appendTo(savedSources);
            });
        }
        $messagesInner.append(bubble);
        scrollToBottom();
        return bubble;
    }

    // ===== 加载历史记录 =====
    var taskQuestion=new URLSearchParams(window.location.search).get('question');
    if(taskQuestion){
        window.newChat();
        $('#queryInput').val(taskQuestion.slice(0,4000));
        $('#agentTaskNotice').text('分析问题已准备好，确认后点击发送。').prop('hidden',false);
    } else $.get('/api/dashboard_chat?action=history', function(res) {
        if (res.code === 0 && res.data) {
            if (res.data.session) {
                sessionId = res.data.session.id;
            }
            if (res.data.messages && res.data.messages.length > 0) {
                $chatHero.addClass('hidden');
                $chatEmpty.hide();
                $.each(res.data.messages, function(i, m) {
                    addBubble(m.role, m.content);
                });
            }
        }
        loadSessionList(sessionId || 0);
    });

    // ===== 快捷提问 =====
    window.quickAsk = function(text) {
        $('#queryInput').val(text);
        window.submitQuery();
    };

    // News QA is orchestrated and persisted by the server-side LangGraph workflow.
    window.submitQuery = async function() {
        if (isStreaming) return layer.msg('AI 正在回复中，请稍候…');
        var q = $('#queryInput').val().trim();
        if (!q) return layer.msg('请输入你的问题');
        if (q.length > 4000) return layer.msg('问题请控制在 4000 字以内');
        if ($('#fileTagsRow .uploading').length) return layer.msg('请等待附件上传完成');
        var selectedFiles = pendingFiles.slice();
        isStreaming = true;
        $sendBtn.prop('disabled', true);
        fullAiResponse = '';
        addBubble('user', q + (selectedFiles.length ? '\n\n附件：' + selectedFiles.map(function(f){return f.file_name;}).join('、') : ''));
        pendingFiles = [];
        $('#fileTagsRow').empty();
        $('#queryInput').val('');
        var bubble = addBubble('assistant', '');
        var content = bubble.find('.msg-bubble').empty();
        var status = $('<div class="qa-status" role="status"></div>').text('正在连接资料库…').appendTo(content);
        content.removeClass('qa-markdown');
        var answer = $('<div class="qa-answer qa-markdown"></div>').appendTo(content);
        var sourcesBox = $('<div class="qa-sources"></div>').hide().appendTo(content);
        try {
            await NewsQa.stream({message:q, session_id:sessionId,file_ids:JSON.stringify(selectedFiles.map(function(f){return f.id;}))}, xsrf, function(data) {
                if (data.type === 'session') {
                    sessionId = data.session_id;
                    loadSessionList(sessionId);
                } else if (data.type === 'status') {
                    status.text(data.message);
                } else if (data.type === 'sources') {
                    sourcesBox.empty();
                    if (data.retrieval) {
                        var scope = data.retrieval;
                        $('<strong></strong>').text(scope.scope + ' · 共 ' + scope.matched_count + ' 条，展示 ' + scope.shown_count + ' 条 · 北京时间').appendTo(sourcesBox);
                        sourcesBox.show();
                    }
                    if (data.sources.length) {
                        $('<strong></strong>').text((data.retrieval && data.retrieval.kind === 'files' ? '参考附件 · ' : '参考新闻 · ') + data.sources.length + ' 条').appendTo(sourcesBox);
                        data.sources.forEach(function(source) {
                            var link = $('<a class="qa-source" target="_blank" rel="noopener noreferrer"></a>');
                            try {
                                var url = new URL(source.url);
                                if (url.protocol === 'https:' || url.protocol === 'http:') link.attr('href', url.href);
                            } catch (_) {}
                            $('<span></span>').text('[' + source.number + ']').appendTo(link);
                            var info = $('<span></span>').appendTo(link);
                            $('<span class="qa-source-title"></span>').text(source.title).appendTo(info);
                            $('<small></small>').text((source.source_name || '资料库') + ' · ' + source.content_kind + (data.retrieval && data.retrieval.kind === 'files' ? ' · 上传于 ' : ' · 采集于 ') + (source.collected_at || source.create_at || '未知时间')).appendTo(info);
                            sourcesBox.append(link);
                        });
                        sourcesBox.show();
                    }
                } else if (data.type === 'content') {
                    fullAiResponse += data.content;
                    NewsQa.renderMarkdown(answer[0], fullAiResponse);
                    status.text('正在根据资料生成回答…');
                } else if (data.type === 'done') {
                    status.text('回答完成 · 已保存' + (data.tokens ? ' · ' + data.tokens + ' Tokens' : ''));
                }
                scrollToBottom();
            });
        } catch (error) {
            status.text('本次回答未完成');
            $('<div class="qa-error" role="alert"></div>').text(error.name === 'AbortError' ? '请求超时，请重试。' : error.message).appendTo(content);
        } finally {
            bubble.find('.msg-time').text(nowTime());
            isStreaming = false;
            $sendBtn.prop('disabled', false);
            loadSessionList(sessionId);
        }
    };

    // ===== 文件上传 =====
    // Attachments stay bound to their conversation on the server.

    window.handleFileSelect = function(e) {
        var files = e.target.files;
        if (!files || !files.length) return;
        for (var i = 0; i < files.length; i++) {
            uploadFile(files[i]);
        }
        // 清空 file input 以便重复选择同一文件
        document.getElementById('fileInput').value = '';
    };

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
        return (bytes/(1024*1024)).toFixed(1) + ' MB';
    }

    function uploadFile(file) {
        var uploadContextVersion = fileContextVersion;
        var fileId = 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
        var safeName = file.name.replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var tagHtml = '<span class="file-tag" id="' + fileId + '">' +
            '<i class="fas fa-file"></i>' +
            '<span class="ft-name">' + safeName + '</span>' +
            '<span class="ft-size">' + formatSize(file.size) + '</span>' +
            '<span class="ft-status uploading">上传中</span>' +
            '</span>';
        $('#fileTagsRow').append(tagHtml);
        $('#uploadBtn').addClass('uploading');

        var formData = new FormData();
        formData.append('file', file);
        formData.append('_xsrf', xsrf);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/dashboard/upload', true);

        // 上传进度
        xhr.upload.addEventListener('progress', function(e) {
            if (e.lengthComputable) {
                var pct = Math.round(e.loaded / e.total * 100);
                $('#' + fileId + ' .ft-status').text(pct + '%');
            }
        });

        xhr.onload = function() {
            if (uploadContextVersion !== fileContextVersion) return;
            try {
                var res = JSON.parse(xhr.responseText);
                if (res.code === 0) {
                    $('#' + fileId + ' .ft-status')
                        .removeClass('uploading').addClass('done').text('✓');
                    $('#' + fileId).append('<span class="ft-remove" onclick="removeFileTag(\'' + fileId + '\', ' + res.data.id + ')" title="移除"><i class="fas fa-times"></i></span>');
                    pendingFiles.push(res.data);
                } else {
                    $('#' + fileId + ' .ft-status')
                        .removeClass('uploading').addClass('fail').text('失败');
                    layer.msg(res.msg || '上传失败', {icon: 2});
                }
            } catch(e) {
                $('#' + fileId + ' .ft-status')
                    .removeClass('uploading').addClass('fail').text('失败');
                layer.msg('响应解析失败: ' + xhr.status, {icon: 2});
            }
            $('#uploadBtn').removeClass('uploading');
        };

        xhr.onerror = function() {
            $('#' + fileId + ' .ft-status')
                .removeClass('uploading').addClass('fail').text('失败');
            $('#uploadBtn').removeClass('uploading');
            layer.msg('网络连接失败', {icon: 2});
        };

        xhr.send(formData);
    }

    window.removeFileTag = function(tagId, fileId) {
        $('#' + tagId).fadeOut(200, function(){ $(this).remove(); });
        pendingFiles = pendingFiles.filter(function(f){ return f.id !== fileId; });
    };

    // 将已上传文件信息附加到用户消息中
    function getFileAttachHtml() {
        if (!pendingFiles.length) return '';
        var html = '';
        $.each(pendingFiles, function(i, f) {
            html += '<div class="msg-file-attach">' +
                '<i class="fas fa-paperclip"></i>' +
                '<span>' + f.file_name.replace(/</g,'&lt;').replace(/>/g,'&gt;') + ' (' + formatSize(f.file_size) + ')</span>' +
                '</div>';
        });
        return html;
    }

    // ===== 导出 PDF =====
    window.exportPdf = function() {
        if (!sessionId) return layer.msg('请先开始对话', {icon: 0});
        window.open('/api/export/pdf?type=session&session_id=' + sessionId, '_blank');
    };

    $('#queryInput').on('keydown', function(e) {
        if (e.keyCode === 13) window.submitQuery();
    });
});
</script>
{% end %}
